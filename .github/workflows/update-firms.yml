name: Update FIRMS data

# Runs six-hourly. The minute offset matters: GitHub queues scheduled jobs and
# on-the-hour crons are the most contended slot, so :17 typically starts sooner.
#
# Scheduled workflows are disabled after 60 days of repository inactivity — but
# this workflow commits on every run, which counts as activity, so it keeps
# itself alive. No manual intervention needed.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:            # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write               # needed to commit the refreshed data back

concurrency:
  group: firms-data
  cancel-in-progress: false     # never let two runs race on the same files

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          # No pip install step: the ETL is standard library only, so there is
          # no dependency resolution that can break the pipeline months from now.

      - name: Fetch and process FIRMS detections
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
          FIRMS_AREA: '112,-45,155,-9'          # west,south,east,north — Australia
          FIRMS_REGION_NAME: 'Australia'
          FIRMS_DAYS: '7'
          FIRMS_RETAIN: '30'
        run: python scripts/fetch_firms.py

      - name: Commit if data changed
        run: |
          git config user.name  'firewatch-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --staged --quiet; then
            echo 'No change in FIRMS data — nothing to commit.'
          else
            git commit -m "data: FIRMS refresh $(date -u +'%Y-%m-%dT%H:%MZ')"
            # Another run may have pushed while this one was working.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Summary
        if: always()
        run: |
          if [ -f data/meta.json ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          m = json.load(open('data/meta.json'))
          c = m['counts']
          print(f"### FIRMS refresh — {m['region']}\n")
          print(f"- Generated: `{m['generated']}`")
          print(f"- Window: `{m['window'][0]}` → `{m['window'][-1]}`")
          print(f"- Detections: **{c['detections']:,}**")
          print(f"- Fire complexes: **{c['clusters']:,}** ({c['active_clusters']:,} active)")
          print(f"- Unclustered: {c['unclustered']:,}")
          print(f"- Radiative energy (FRE): **{m['fre_total_gj']/1e6:,.2f} PJ**")
          print(f"- Peak detection: {m['frp_max_mw']:,.0f} MW")
          print(f"- Cumulative FRP (index): {m['frp_total_mw']:,.0f} MW")
          f = m['params']['fre']
          print(f"- Overpass interval: {f['median_overpass_interval_h']} h median "
                f"→ edge dt {f['edge_dt_h']} h, gap cap {f['max_gap_h']} h")
          print(f"- Archive: {m['archive_days']} days")
          print(f"- API requests this run: {m['requests_made']}")
          print("\n| Sensor | Detections |\n|---|---:|")
          for k, v in m['counts']['by_sensor'].items():
              print(f"| {k} | {v:,} |")
          PY
          else
            echo 'No meta.json produced — the ETL failed. Check the step log above.' >> "$GITHUB_STEP_SUMMARY"
          fi
