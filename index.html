<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireWatch: SE Asia & Australia</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #111; color: #fff; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        #console {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background-color: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        h1 { font-size: 18px; margin: 0 0 10px; color: #ff5e00; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 12px; line-height: 1.5; color: #ccc; margin-bottom: 20px; }
        
        .session { margin-bottom: 20px; }
        .label { font-size: 12px; color: #ccc; display: flex; justify-content: space-between; margin-top: 5px;}
        
        /* Slider Styling */
        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: #444;
            height: 4px;
            border-radius: 2px;
            outline: none;
            margin: 10px 0;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ff5e00;
            cursor: pointer;
            border: 2px solid #fff;
            transition: background .2s;
        }
        input[type=range]::-webkit-slider-thumb:hover {
            background: #ff8c00;
            transform: scale(1.1);
        }

        .legend-key { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; margin-bottom: 5px; }
        
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: black; padding: 10px 20px; border-radius: 4px; font-size: 14px;
            border: 1px solid #ff5e00; z-index: 200;
        }
    </style>
</head>
<body>

<div id="loading">Fetching NASA Satellite Data...</div>

<div id="console">
    <h1>FireWatch Tracker</h1>
    <p>Visualizing MODIS/VIIRS thermal anomalies for the last 7 days across Australia & SE Asia.</p>
    
    <div class="session">
        <div class="label" style="font-weight:bold; color:white; margin-bottom:5px;">
            Filter: <span id="active-date" style="color:#ff5e00">Loading...</span>
        </div>
        
        <input id="slider" type="range" disabled>
        
        <div class="label">
            <span id="start-date">Oldest</span>
            <span id="end-date">Latest</span>
        </div>
    </div>

    <div class="session">
        <div style="font-weight:bold; color:white; margin-bottom:10px;">Brightness (Kelvin)</div>
        <div class="legend-item"><span class="legend-key" style="background: #ffeb3b;"></span> Low Intensity (< 320K)</div>
        <div class="legend-item"><span class="legend-key" style="background: #ff9800;"></span> Moderate (320-350K)</div>
        <div class="legend-item"><span class="legend-key" style="background: #ff2a00;"></span> Extreme (> 350K)</div>
    </div>
</div>

<div id="map"></div>

<script>
    const map = new maplibregl.Map({
        container: 'map',
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [133.7751, -25.2744],
        zoom: 3.5
    });

    const region = "Australia_NewZealand"; 
    const nasaUrl = `https://firms.modaps.eosdis.nasa.gov/data/active_fire/modis-c6.1/csv/MODIS_C6_1_${region}_7d.csv`;
    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(nasaUrl);

    let wildfireData = null;
    const dates = [];

    map.on('load', () => {
        Papa.parse(proxyUrl, {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: function(results) {
                document.getElementById('loading').style.display = 'none';
                
                const geojson = {
                    type: "FeatureCollection",
                    features: results.data
                        .filter(row => row.latitude && row.longitude)
                        .map(row => {
                            if (!dates.includes(row.acq_date)) dates.push(row.acq_date);
                            return {
                                type: "Feature",
                                geometry: { type: "Point", coordinates: [row.longitude, row.latitude] },
                                properties: {
                                    brightness: row.brightness,
                                    date: row.acq_date,
                                    confidence: row.confidence
                                }
                            };
                        })
                };
                
                dates.sort();
                wildfireData = geojson;

                // --- FIX 1: Configure Slider AFTER data load ---
                const slider = document.getElementById('slider');
                
                // Set max to dates.length. 
                // If we have 7 days (indices 0-6), max=7. Index 7 will be "Show All".
                slider.max = dates.length; 
                slider.min = 0;
                slider.step = 1;
                
                // Set initial view to the LATEST day (dates.length - 1) to avoid initial clutter
                slider.value = dates.length - 1; 
                slider.disabled = false;

                // Set Labels
                document.getElementById('start-date').innerText = dates[0];
                document.getElementById('end-date').innerText = "All Days"; // Update label to indicate the end option
                
                // Add layer and apply INITIAL filter
                addFireLayer(geojson);
                
                // Trigger the filter logic immediately for the initial state
                updateFilter(parseInt(slider.value)); 
            },
            error: function(err) {
                console.error("Error fetching NASA data:", err);
                document.getElementById('loading').innerText = "Error loading data.";
            }
        });
    });

    // --- FIX 2: Extracted Filter Logic for re-use ---
    function updateFilter(index) {
        const sliderLabel = document.getElementById('active-date');
        
        if (index === dates.length) {
            // Option A: Slider is at the very end ("All Days")
            // Remove the filter to show everything
            map.setFilter('fire-points', null);
            sliderLabel.innerText = "All 7 Days (Aggregated)";
        } else {
            // Option B: Slider is on a specific day
            const selectedDate = dates[index];
            sliderLabel.innerText = selectedDate;
            map.setFilter('fire-points', ['==', ['get', 'date'], selectedDate]);
        }
    }

    function addFireLayer(data) {
        map.addSource('fires', { type: 'geojson', data: data });

        map.addLayer({
            id: 'fire-points',
            type: 'circle',
            source: 'fires',
            paint: {
                'circle-radius': [
                    'interpolate', ['linear'], ['zoom'],
                    3, 2,
                    10, 8
                ],
                'circle-color': [
                    'step', ['get', 'brightness'],
                    '#ffeb3b',
                    320, '#ff9800',
                    350, '#ff2a00'
                ],
                'circle-opacity': 0.8,
                'circle-stroke-width': 0
            }
        });

        // Interaction: Time Slider
        document.getElementById('slider').addEventListener('input', (e) => {
            const index = parseInt(e.target.value);
            updateFilter(index);
        });
        
        // Interaction: Hover & Click
        map.on('mouseenter', 'fire-points', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'fire-points', () => map.getCanvas().style.cursor = '');
        
        map.on('click', 'fire-points', (e) => {
            const props = e.features[0].properties;
            new maplibregl.Popup()
                .setLngLat(e.lngLat)
                .setHTML(`<strong>Date:</strong> ${props.date}<br><strong>Brightness:</strong> ${props.brightness}K`)
                .addTo(map);
        });
    }
</script>

</body>
</html>
