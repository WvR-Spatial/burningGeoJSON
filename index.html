<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FireWatch: SE Asia & Australia</title>
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background: #111; color: #fff; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }
        
        /* UI Overlay */
        #console {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            background-color: rgba(30, 30, 30, 0.9);
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #444;
            backdrop-filter: blur(5px);
            z-index: 100;
        }
        h1 { font-size: 18px; margin: 0 0 10px; color: #ff5e00; text-transform: uppercase; letter-spacing: 1px; }
        p { font-size: 12px; line-height: 1.5; color: #ccc; margin-bottom: 20px; }
        
        /* Slider Styling */
        .session { margin-bottom: 20px; }
        .row { height: 12px; width: 100%; }
        .label { font-size: 12px; color: #ccc; display: flex; justify-content: space-between; margin-top: 5px;}
        input[type=range] {
            width: 100%;
            -webkit-appearance: none;
            background: #444;
            height: 4px;
            border-radius: 2px;
            outline: none;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #ff5e00;
            cursor: pointer;
            border: 2px solid #fff;
        }

        /* Legend */
        .legend-key { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 5px; }
        .legend-item { display: flex; align-items: center; font-size: 12px; margin-bottom: 5px; }
        
        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: black; padding: 10px 20px; border-radius: 4px; font-size: 14px;
            border: 1px solid #ff5e00; z-index: 200;
        }
    </style>
</head>
<body>

<div id="loading">Fetching NASA Satellite Data...</div>

<div id="console">
    <h1>FireWatch Tracker</h1>
    <p>Visualizing MODIS/VIIRS thermal anomalies for the last 7 days across Australia & SE Asia.</p>
    
    <div class="session">
        <div class="label" style="font-weight:bold; color:white; margin-bottom:10px;">Filter by Day: <span id="active-date">All</span></div>
        <input id="slider" type="range" min="0" max="6" step="1" value="6">
        <div class="label">
            <span id="start-date">-7 Days</span>
            <span>Today</span>
        </div>
    </div>

    <div class="session">
        <div style="font-weight:bold; color:white; margin-bottom:10px;">Brightness (Kelvin)</div>
        <div class="legend-item"><span class="legend-key" style="background: #ffeb3b;"></span> Low Intensity (< 320K)</div>
        <div class="legend-item"><span class="legend-key" style="background: #ff9800;"></span> Moderate (320-350K)</div>
        <div class="legend-item"><span class="legend-key" style="background: #ff2a00;"></span> Extreme (> 350K)</div>
    </div>
</div>

<div id="map"></div>

<script>
    // 1. Initialize MapLibre (Free open-source alternative to Mapbox)
    const map = new maplibregl.Map({
        container: 'map',
        // Using Carto's Dark Matter style for free (great for visualizing light/fire)
        style: 'https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json',
        center: [133.7751, -25.2744], // Center on Australia
        zoom: 3.5
    });

    // URLs for NASA FIRMS Data (MODIS C6.1) - 7 Day rolling csv
    // We use a corsproxy because NASA servers sometimes block direct browser requests from local files
    const region = "Australia_NewZealand"; 
    const nasaUrl = `https://firms.modaps.eosdis.nasa.gov/data/active_fire/modis-c6.1/csv/MODIS_C6_1_${region}_7d.csv`;
    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(nasaUrl);

    let wildfireData = null; // Store the GeoJSON here
    const dates = []; // Store unique dates for the slider

    map.on('load', () => {
        
        // 2. Fetch and Parse Data
        Papa.parse(proxyUrl, {
            download: true,
            header: true,
            dynamicTyping: true,
            complete: function(results) {
                // Remove loading spinner
                document.getElementById('loading').style.display = 'none';
                
                // Convert CSV to GeoJSON
                const geojson = {
                    type: "FeatureCollection",
                    features: results.data
                        .filter(row => row.latitude && row.longitude) // Filter invalid rows
                        .map(row => {
                            // Extract unique dates for our slider logic
                            if (!dates.includes(row.acq_date)) dates.push(row.acq_date);
                            
                            return {
                                type: "Feature",
                                geometry: {
                                    type: "Point",
                                    coordinates: [row.longitude, row.latitude]
                                },
                                properties: {
                                    brightness: row.brightness,
                                    date: row.acq_date,
                                    confidence: row.confidence
                                }
                            };
                        })
                };
                
                // Sort dates for the slider
                dates.sort();
                wildfireData = geojson;
                
                // Update slider UI labels
                document.getElementById('start-date').innerText = dates[0];
                document.getElementById('active-date').innerText = dates[dates.length-1];

                addFireLayer(geojson);
            },
            error: function(err) {
                console.error("Error fetching NASA data:", err);
                document.getElementById('loading').innerText = "Error loading data. Check console.";
            }
        });
    });

    // 3. Visualization Logic
    function addFireLayer(data) {
        // Add Source
        map.addSource('fires', {
            type: 'geojson',
            data: data
        });

        // Add Layer (Heatmap/Circle style)
        map.addLayer({
            id: 'fire-points',
            type: 'circle',
            source: 'fires',
            paint: {
                // Size circle by confidence (higher confidence = bigger)
                'circle-radius': [
                    'interpolate', ['linear'], ['zoom'],
                    3, 2,  // At zoom 3, 2px radius
                    10, 8  // At zoom 10, 8px radius
                ],
                // Color circle by brightness (Temperature in Kelvin)
                'circle-color': [
                    'step', ['get', 'brightness'],
                    '#ffeb3b', // Yellow (Low)
                    320, '#ff9800', // Orange (Medium)
                    350, '#ff2a00'  // Red (High)
                ],
                'circle-opacity': 0.8,
                'circle-stroke-width': 0
            }
        });

        // 4. Interaction: Time Slider
        document.getElementById('slider').addEventListener('input', (e) => {
            const index = parseInt(e.target.value);
            const selectedDate = dates[index];
            document.getElementById('active-date').innerText = selectedDate;

            // MapLibre Filter: Show only features where 'date' == selectedDate
            map.setFilter('fire-points', ['==', ['get', 'date'], selectedDate]);
        });
        
        // Interaction: Hover Pointer
        map.on('mouseenter', 'fire-points', () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', 'fire-points', () => map.getCanvas().style.cursor = '');
        
        // Interaction: Click for details
        map.on('click', 'fire-points', (e) => {
            const coordinates = e.features[0].geometry.coordinates.slice();
            const props = e.features[0].properties;

            new maplibregl.Popup()
                .setLngLat(coordinates)
                .setHTML(`<strong>Date:</strong> ${props.date}<br><strong>Brightness:</strong> ${props.brightness}K<br><strong>Confidence:</strong> ${props.confidence}%`)
                .addTo(map);
        });
    }
</script>

</body>
</html>
